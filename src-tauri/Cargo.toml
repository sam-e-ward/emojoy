[package]
name = "emojoy"
version = "0.2.1"
description = "A lightweight emoji picker triggered by :::"
authors = ["Sam Ward"]
edition = "2021"

[lib]
name = "emojoy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
log = "0.4"
simplelog = "0.12"
dirs = "6"


[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
cocoa = "0.26"
objc = "0.2"
